[package]
name = "romantic-installer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
